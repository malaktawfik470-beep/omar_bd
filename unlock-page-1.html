<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf3fc">
<title>a little secret ♡</title>
<style>
  :root {
    --sky: #eaf3fc;
    --blue: #afc9e8;
    --ink: #526f91;
    --muted: #899db5;
    --line: #d5e3f2;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 28px 16px; color: var(--ink);
    background:
      radial-gradient(circle at 12% 15%, #ffffff 0 3px, transparent 4px),
      radial-gradient(circle at 86% 78%, #ffffff 0 4px, transparent 5px),
      var(--sky);
    font-family: Georgia, "Times New Roman", serif;
  }
  .wrap { width: min(100%, 440px); position: relative; }
  .sparkle { position: absolute; color: #b7cce5; font-size: 25px; opacity: .85; }
  .s1 { top: -19px; left: 10px; transform: rotate(-14deg); }
  .s2 { top: 35px; right: -4px; font-size: 20px; }
  .s3 { bottom: 8px; left: -8px; font-size: 19px; }
  .card {
    position: relative; text-align: center; padding: 46px 28px 36px;
    background: rgba(255,255,255,.94); border: 1px solid #dbe7f4;
    border-radius: 30px; box-shadow: 0 18px 45px rgba(111,143,180,.16);
    animation: float-in .7s ease both;
  }
  .bow { font-size: 40px; line-height: 1; margin-bottom: 18px; color: var(--blue); }
  h1 { margin: 0 0 14px; font-size: clamp(25px, 7vw, 32px); font-weight: 600; letter-spacing: .2px; }
  .rule { display:flex; align-items:center; gap:13px; justify-content:center; margin: 18px 0; color: var(--blue); }
  .rule:before, .rule:after { content:""; height:1px; width:65px; background:#c7d8ec; }
  .heart { font-size: 22px; }
  p { margin: 0 auto 24px; max-width: 300px; color: var(--muted); font: 16px/1.65 Arial, sans-serif; }
  input {
    width: 100%; height: 62px; border: 2px solid #d4e2f1; border-radius: 17px;
    outline: none; background: #fbfdff; color: var(--ink); text-align: center;
    font: 26px/1 Arial, sans-serif; letter-spacing: 13px; padding: 0 12px 0 24px;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px #eaf3fc; }
  button {
    margin-top: 22px; width: min(100%, 230px); min-height: 58px; border: 0;
    border-radius: 999px; background: var(--blue); color: white; cursor: pointer;
    font: 20px Georgia, serif; box-shadow: 0 5px 0 #98b6d9;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #98b6d9; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #98b6d9; }
  #feedback { min-height: 26px; margin: 20px 0 0; font: 14px Arial, sans-serif; color: #899db5; }
  .tiny { margin-top: 16px; color: #b1c3d8; font-size: 19px; }
  @keyframes float-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width: 380px) { .card { padding: 38px 20px 30px; } input { letter-spacing: 10px; } }
  @media (prefers-reduced-motion: reduce) { .card { animation:none; } * { transition:none !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <span class="sparkle s1" aria-hidden="true">✦</span>
    <span class="sparkle s2" aria-hidden="true">♡</span>
    <span class="sparkle s3" aria-hidden="true">✧</span>
    <section class="card" aria-labelledby="heading">
      <div class="bow" aria-hidden="true">୨୧</div>
      <h1 id="heading">one last little secret...</h1>
      <div class="rule"><span class="heart">♡</span></div>
      <p>enter the 4-digit code<br>to unlock your surprise ♡</p>
      <form id="pin-form">
        <label for="pin" style="position:absolute;left:-9999px">4-digit code</label>
        <input id="pin" name="pin" type="password" inputmode="numeric"
          pattern="[0-9]{4}" maxlength="4" minlength="4" placeholder="••••"
          autocomplete="off" required aria-describedby="feedback">
        <button type="submit">unlock ♡</button>
        <div id="feedback" role="status" aria-live="polite"></div>
      </form>
      <div class="tiny" aria-hidden="true">───── ♥ ─────</div>
    </section>
  </main>
<script>
  const form = document.getElementById('pin-form');
  const pin = document.getElementById('pin');
  const feedback = document.getElementById('feedback');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (pin.value === '1012') {
      feedback.textContent = 'access granted ♡';
      window.location.href = 'https://maloukkk13.carrd.co/#birthday';
    } else {
      feedback.textContent = "oops! that's not it, try again ♡";
      pin.value = '';
      pin.focus();
    }
  });
</script>
</body>
</html>
